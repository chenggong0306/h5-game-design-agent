<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 魔方</title>
<style>
    body { margin:0; overflow:hidden; background:#0f0f1a; font-family:'Segoe UI',sans-serif; user-select:none; touch-action:none; color:#fff; }
    canvas { display:block; width:100vw; height:100vh; }
    #ui { position:absolute; top:20px; left:20px; pointer-events:none; text-shadow:0 2px 4px rgba(0,0,0,.5); }
    #ui h1 { font-size:28px; margin:0 0 8px; letter-spacing:2px; font-weight:300; color:#a0a0ff; }
    #stats { font-size:18px; opacity:.85; font-family:monospace; }
    .controls { position:absolute; bottom:30px; width:100%; text-align:center; color:#666; font-size:14px; pointer-events:none; line-height:1.6; }
    .btn-group { position:absolute; bottom:100px; right:20px; display:grid; grid-template-columns:repeat(3,50px); gap:10px; pointer-events:auto; }
    .btn { width:50px; height:50px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; font-weight:bold; transition:.2s; }
    .btn:active { background:rgba(255,255,255,.3); transform:scale(.9); }
    #reset-btn { position:absolute; bottom:100px; left:20px; width:80px; height:50px; background:rgba(255,100,100,.2); border:1px solid rgba(255,100,100,.4); color:#faa; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; font-weight:bold; pointer-events:auto; }
    #reset-btn:active { background:rgba(255,100,100,.4); }
</style>
</head>
<body>
<div id="ui"><h1>3D CUBE</h1><div id="stats">步数: 0</div></div>
<div id="reset-btn">重置</div>
<div class="btn-group">
    <div class="btn" data-key="U">U</div><div class="btn" data-key="D">D</div>
    <div class="btn" data-key="L">L</div><div class="btn" data-key="R">R</div>
    <div class="btn" data-key="F">F</div><div class="btn" data-key="B">B</div>
</div>
<div class="controls">拖拽屏幕旋转视角<br>点击按钮或键盘 U D L R F B 旋转层 | 空格重置</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $stats = document.getElementById('stats');
let W, H, dpr;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

const C = { U:'#FFF', D:'#FF0', L:'#F80', R:'#F00', F:'#0A0', B:'#00F', INNER:'#1a1a2e' };

class V3 {
    constructor(x=0,y=0,z=0) { this.x=x;this.y=y;this.z=z; }
    add(b) { return new V3(this.x+b.x, this.y+b.y, this.z+b.z); }
    sub(b) { return new V3(this.x-b.x, this.y-b.y, this.z-b.z); }
    mul(s) { return new V3(this.x*s, this.y*s, this.z*s); }
    dot(b) { return this.x*b.x + this.y*b.y + this.z*b.z; }
    cross(b) { return new V3(this.y*b.z-this.z*b.y, this.z*b.x-this.x*b.z, this.x*b.y-this.y*b.x); }
    len() { return Math.sqrt(this.x*this.x+this.y*this.y+this.z*this.z); }
    norm() { const l=this.len(); return l<1e-9?new V3():new V3(this.x/l,this.y/l,this.z/l); }
}
function rotX(v,a) { const c=Math.cos(a),s=Math.sin(a); return new V3(v.x, v.y*c-v.z*s, v.y*s+v.z*c); }
function rotY(v,a) { const c=Math.cos(a),s=Math.sin(a); return new V3(v.x*c+v.z*s, v.y, -v.x*s+v.z*c); }
function rotZ(v,a) { const c=Math.cos(a),s=Math.sin(a); return new V3(v.x*c-v.y*s, v.x*s+v.y*c, v.z); }

class Cubelet {
    constructor(x,y,z) { this.p = new V3(x,y,z); this.orig = new V3(x,y,z); }
    getFaces() {
        const faces = [];
        const dirs = [
            { n:new V3(0,-1,0), k:'U' },{ n:new V3(0,1,0), k:'D' },
            { n:new V3(-1,0,0), k:'L' },{ n:new V3(1,0,0), k:'R' },
            { n:new V3(0,0,1), k:'F' }, { n:new V3(0,0,-1), k:'B' },
        ];
        for (const d of dirs) {
            const o=this.orig, n=d.n;
            const outer = (n.x===-1&&o.x===-1)||(n.x===1&&o.x===1)||(n.y===-1&&o.y===-1)||(n.y===1&&o.y===1)||(n.z===1&&o.z===1)||(n.z===-1&&o.z===-1);
            faces.push({ n:d.n, c:outer?C[d.k]:C.INNER });
        }
        return faces;
    }
    rotate(axis, angle) {
        const fn = axis==='x'?rotX:axis==='y'?rotY:rotZ;
        this.p = fn(this.p, angle); this.orig = fn(this.orig, angle);
        this.orig.x=Math.round(this.orig.x); this.orig.y=Math.round(this.orig.y); this.orig.z=Math.round(this.orig.z);
    }
}

let cubes=[], moves=0, vRY=0.7, vRX=-0.5;

function init() {
    cubes=[];
    for (let x=-1;x<=1;x++) for (let y=-1;y<=1;y++) for (let z=-1;z<=1;z++) cubes.push(new Cubelet(x,y,z));
    moves=0; $stats.textContent='步数: 0';
}

function rotLayer(axis, layer, angle) {
    for (const c of cubes) {
        const v = axis==='x'?c.orig.x:axis==='y'?c.orig.y:c.orig.z;
        if (Math.abs(v-layer)<.1) c.rotate(axis, angle);
    }
    moves++; $stats.textContent='步数: '+moves;
}

// ★ 修复点：透视投影去掉多余的 *100 因子
// 原: v.x*100*f + f=600/(6+v.z) → 总比例 ≈10000 → 魔方飞到屏幕外
// 改: f=180/(8+v.z)，直接用 v.x*f → 总比例 ≈22 → 魔方在屏幕内 ~200px
function proj(w) {
    let v = rotX(w, vRX);
    v = rotY(v, vRY);
    // 弱透视：深度对缩放的影响控制在小范围，远近面尺寸一致、看起来像正方体
    const unit = Math.min(W, H) * 0.18;       // 1 个 cubelet ≈ 屏幕的 18%
    const perspective = 1 - v.z * 0.04;        // ±2→1.08~0.92，仅 ~15% 差异
    const f = unit * perspective;
    return { x: W/2 + v.x*f, y: H/2 - v.y*f, z: v.z };
}

function faceVerts(c, n) {
    const h=.47, t=Math.abs(n.x)<.9?new V3(1,0,0):new V3(0,1,0);
    const u=n.cross(t).norm(), v=n.cross(u).norm(), cen=c.p.add(n.mul(h));
    return [cen.add(u.mul(h)).add(v.mul(h)), cen.add(u.mul(-h)).add(v.mul(h)),
            cen.add(u.mul(-h)).add(v.mul(-h)), cen.add(u.mul(h)).add(v.mul(-h))];
}

function drawFace(pts3, color) {
    const pts = pts3.map(proj);
    ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y); ctx.lineTo(pts[3].x,pts[3].y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawC(c) {
    for (const f of c.getFaces()) {
        let vn=rotX(f.n,vRX); vn=rotY(vn,vRY);
        if (vn.z<=0) continue;
        drawFace(faceVerts(c, f.n), f.c);
    }
}

function loop() {
    ctx.fillStyle='#0f0f1a'; ctx.fillRect(0,0,W,H);
    const projCubes = cubes.map(c=>({c, z:proj(c.p).z}));
    projCubes.sort((a,b)=>a.z-b.z);
    for (const {c} of projCubes) drawC(c);
    requestAnimationFrame(loop);
}

let dragging=false, lx=0, ly=0;
canvas.addEventListener('pointerdown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
window.addEventListener('pointermove', e=>{
    if (!dragging) return;
    vRY+=(e.clientX-lx)*.008; vRX+=(e.clientY-ly)*.008;
    lx=e.clientX; ly=e.clientY;
});
window.addEventListener('pointerup', ()=>dragging=false);
window.addEventListener('keydown', e=>{
    const k=e.key.toUpperCase(), T=Math.PI/2;
    if (k==='U') rotLayer('y',-1,-T); if (k==='D') rotLayer('y',1,T);
    if (k==='L') rotLayer('x',-1,-T); if (k==='R') rotLayer('x',1,T);
    if (k==='F') rotLayer('z',1,T);  if (k==='B') rotLayer('z',-1,-T);
    if (k===' ') init();
});
document.querySelectorAll('.btn').forEach(b=>{
    b.addEventListener('pointerdown', ()=>{
        const k=b.dataset.key, T=Math.PI/2;
        if (k==='U') rotLayer('y',-1,-T); if (k==='D') rotLayer('y',1,T);
        if (k==='L') rotLayer('x',-1,-T); if (k==='R') rotLayer('x',1,T);
        if (k==='F') rotLayer('z',1,T);  if (k==='B') rotLayer('z',-1,-T);
    });
});
document.getElementById('reset-btn').addEventListener('pointerdown', init);
init(); loop();
</script>
</body>
</html>

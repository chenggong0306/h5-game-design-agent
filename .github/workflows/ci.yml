name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python + dependencies
        run: |
          uv sync --frozen
          uv pip install ruff --quiet

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/ --select E,F,B --ignore E501

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

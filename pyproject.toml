[project]
name = "game-design-agent"
version = "0.1.0"
description = "基于知识库的 AI 游戏设计智能体 - 引导用户设计游戏并输出可编辑代码"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",          # LangGraph AsyncSqliteSaver checkpointer（代码直接 import）
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "structlog>=25.1.0",
    "tiktoken>=0.7.0",            # 上下文 token 计数依赖
    "truststore>=0.9.0",          # main.py 注入系统证书（企业代理 HTTPS）
    "uvicorn>=0.46.0",
]
# 可选：无头浏览器运行检查（SELF_CHECK_HEADLESS=true 时需要）。装法：
#   pip install ".[headless]"  &&  playwright install chromium
[project.optional-dependencies]
headless = ["playwright>=1.40"]

[project.scripts]
game-design = "main:main"

[tool.ruff.lint.per-file-ignores]
# main.py 必须在所有 import 之前 load_dotenv / 注入 truststore，E402 是刻意的
"src/main.py" = ["E402"]
# routes/game_agent 的分节延迟 import 是刻意的；File(...) 参数默认值是 FastAPI 标准写法（B008 误报）
"src/api/routes.py" = ["E402", "B008"]
"src/agent/game_agent.py" = ["E402"]

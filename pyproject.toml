[project]
name = "game-design-agent"
version = "0.1.0"
description = "基于知识库的 AI 游戏设计智能体 - 引导用户设计游戏并输出可编辑代码"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langmem>=0.0.30",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "structlog>=25.1.0",
    "uvicorn>=0.46.0",
    "websockets>=16.0",
]

[project.scripts]
game-design = "main:main"
